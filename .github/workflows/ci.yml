name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Development CI intentionally tests proposed analyzer code. No secrets or write token.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fictional fixture reports (complete and partial)
        shell: bash
        run: |
          set -euo pipefail
          node dist/cli.js --base-dir fixtures/demo/base --head-dir fixtures/demo/head --output-dir "$RUNNER_TEMP/demo"
          mkdir "$RUNNER_TEMP/partial"
          printf "import 'unsupported-package';\n" > "$RUNNER_TEMP/partial/a.ts"
          set +e
          node dist/cli.js --base-dir fixtures/zero/base --head-dir "$RUNNER_TEMP/partial" --output-dir "$RUNNER_TEMP/partial-report"
          result=$?
          set -e
          if [ "$result" -ne 2 ]; then
            echo 'Partial fixture must produce exit 2'; exit 1
          fi
          cat "$RUNNER_TEMP/demo/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/partial-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Fictional fixture artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fixture-reports
          path: |
            ${{ runner.temp }}/demo/report.*
            ${{ runner.temp }}/partial-report/report.*
          if-no-files-found: error
          retention-days: 7
